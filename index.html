<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>XZXHS 小红书解析</title>

<style>
body{
    font-family:Arial,"Microsoft YaHei";
    max-width:700px;
    margin:40px auto;
    padding:20px;
}

textarea{
    width:100%;
    height:120px;
    font-size:16px;
    padding:10px;
}

button{
    margin-top:15px;
    width:100%;
    height:45px;
    font-size:18px;
}

#result{
    margin-top:20px;
    word-break:break-all;
}
</style>

</head>

<body>

<h2>小红书链接解析</h2>

<textarea id="input" placeholder="粘贴小红书分享文本"></textarea>

<button onclick="parse()">开始解析</button>

<div id="result"></div>


<script>

function parse(){

let text=document.getElementById("input").value;

let match=text.match(/https?:\/\/xhslink\.cn\/\S+/);

if(match){

document.getElementById("result").innerHTML=
"发现分享链接:<br>"+match[0];

}else{

document.getElementById("result").innerHTML=
"没有找到小红书链接";

}

}

</script>


</body>
</html>
